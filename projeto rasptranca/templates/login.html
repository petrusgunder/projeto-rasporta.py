{% extends "base.html" %}
{% block titulo %}{{ t('login_titulo') }} - {{ t('app_titulo') }}{% endblock %}

{% block conteudo %}
    <h1>{{ t('login_titulo') }}</h1>
    <h2>{{ t('login_subtitulo') }}</h2>

    <form action="{{ url_for('login') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="email" name="email" placeholder="{{ t('email') }}" required autofocus>
        <input type="password" name="senha" placeholder="{{ t('senha') }}" required>
        <button type="submit">{{ t('login_titulo') }}</button>
    </form>

    {% if erro %}
        <div class="resultado invalida">{{ erro }}</div>
    {% endif %}

    <p class="link-extra">{{ t('login_aviso_conta') }}</p>
{% endblock %}
